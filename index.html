<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>色覚サポートカメラ</title>
<style>
  /* UIはニュートラルグレー：色の見え方に影響させないため */
  :root{--bg:#2b2b2d;--panel:#38383b;--line:#55555a;--text:#ececee;--sub:#a9a9b0;--accent:#6a9bf4}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
  body{height:100dvh;overflow:hidden}
  #stage{position:absolute;inset:0;background:#1f1f21;touch-action:none;overflow:hidden}
  canvas#view{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
  #start p{margin:0;color:var(--sub);font-size:13px;line-height:1.7;max-width:30em}
  button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}
  button:focus-visible,input:focus-visible+label,input[type=range]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;font-size:16px;padding:12px 24px}
  #readout{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top));display:none;align-items:center;gap:10px;background:rgba(40,40,43,.88);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-width:calc(100% - 20px)}
  #sw{width:34px;height:34px;border-radius:8px;border:2px solid #fff;flex:none}
  #cname{font-size:18px;font-weight:700}
  #chex{font-size:12px;color:var(--sub)}
  #mark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000;pointer-events:none;display:none}
  #note{position:absolute;left:10px;right:10px;top:calc(72px + env(safe-area-inset-top));background:rgba(40,40,43,.88);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.6;white-space:pre-line;color:var(--text);display:none}
  #status{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));background:rgba(40,40,43,.88);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--text);max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body:not(.ui) #status{visibility:hidden}
  #panel{position:absolute;left:0;right:0;bottom:0;max-width:600px;max-height:78dvh;overflow:auto;margin:0 auto;background:rgba(50,50,53,.96);backdrop-filter:blur(8px);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:6px 16px calc(14px + env(safe-area-inset-bottom));display:grid;gap:14px;box-shadow:0 -8px 30px rgba(0,0,0,.35);transition:transform .22s ease,opacity .22s ease}
  body:not(.ui) #panel{transform:translateY(100%);opacity:0;pointer-events:none}
  body:not(.ui) #readout,body:not(.ui) #mark,body:not(.ui) #note{visibility:hidden}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
  .sect{display:grid;gap:8px}
  .sect h3{margin:0;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.04em}
  .chips{display:grid;gap:8px}.chips.c4{grid-template-columns:repeat(4,1fr)}
  .chips input{position:absolute;opacity:0;pointer-events:none}
  .chips label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;padding:6px 2px;text-align:center;border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.25;cursor:pointer;background:var(--bg);transition:background .15s,border-color .15s}
  .chips label small{font-size:11px;color:var(--sub)}
  .chips input:checked+label{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chips input:checked+label small{color:#e4ecff}
  .chips input:focus-visible+label{outline:3px solid #fff;outline-offset:2px}
  #modeDesc{margin:0;font-size:12px;line-height:1.6;color:var(--sub);min-height:2.4em}
  .toggles{display:flex;gap:10px;flex-wrap:wrap}
  .sw{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;min-height:36px}
  .sw input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
  .sw input::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
  .sw input:checked{background:var(--accent)}.sw input:checked::after{transform:translateX(18px)}
  .sw input:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .sliders{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .sliders label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--sub);margin-bottom:4px}
  .sliders b{font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;height:28px;accent-color:var(--accent);margin:0}
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .acts button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;font-size:12px;line-height:1.2;border-radius:12px}
  .acts svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .acts button.hl{border-color:var(--accent);color:#cfe0ff}
  @media (min-width:900px){
    #panel{left:auto;top:0;bottom:0;right:0;width:380px;max-width:none;max-height:none;border-radius:0;border:0;border-left:1px solid var(--line);padding-top:calc(14px + env(safe-area-inset-top))}
    .grab{display:none}
    body:not(.ui) #panel{transform:translateX(100%)}
    #status{right:394px}
  }
  @media (prefers-reduced-motion:reduce){#panel,.chips label,.sw input,.sw input::after{transition:none}}
  #test{position:absolute;inset:0;z-index:5;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));overflow:auto}
  #tQ,#tRes{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px}
  #tRes{display:none}
  #tTitle{margin:0;font-size:14px;text-align:center}
  #tHint{margin:0;font-size:11px;color:var(--sub);text-align:center}
  #plate{width:min(86vw,46vh);height:auto;border-radius:50%}
  #pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(86vw,340px)}
  #pad button{padding:11px 0;font-size:20px}
  #tAns{font-size:30px;letter-spacing:.25em;min-height:40px;font-weight:700}
  #tNone{width:min(86vw,340px)}
  .tfoot{display:flex;justify-content:space-between;align-items:center;width:min(86vw,340px);font-size:12px;color:var(--sub)}
  #tResTxt{white-space:pre-line;font-size:14px;line-height:1.7;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
  .btns2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="mark"></div>
  <div id="readout"><div id="sw"></div><div><div id="cname">-</div><div id="chex"></div></div></div>
  <div id="note"></div>
  <div id="start">
    <button class="primary" id="startBtn">カメラを開始</button>
    <button id="chartBtn0">テスト画像で試す</button>
    <button id="testBtn0">色覚テスト（数字）で自動設定</button>
    <p>画面をタップすると操作パネルと色の名前が出ます（もう一度タップで消えます）。<br>方式：赤緑→青黄の投影（Viénotら）／色相回転（Zhuら, UIST 2024）／見え方の近似（Machadoら, 2009）／数字テスト（Cambridge Colour Test の考え方）。映像は端末の外に送られません。</p>
  </div>

  <div id="status"></div>
  <div id="panel" role="region" aria-label="操作パネル">
    <div class="grab"></div>
    <div class="sect"><h3>色覚のタイプ</h3>
      <div class="chips c4">
        <input type="radio" name="type" id="ty_p" value="p" checked><label for="ty_p">P型<small>赤が弱い</small></label>
        <input type="radio" name="type" id="ty_d" value="d"><label for="ty_d">D型<small>緑が弱い</small></label>
        <input type="radio" name="type" id="ty_t" value="t"><label for="ty_t">T型<small>青が弱い</small></label>
        <input type="radio" name="type" id="ty_a" value="a"><label for="ty_a">全色盲<small>色なし</small></label>
      </div></div>
    <div class="sect"><h3>表示モード</h3>
      <div class="chips c4">
        <input type="radio" name="proc" id="pr0" value="0" checked><label for="pr0">そのまま</label>
        <input type="radio" name="proc" id="pr1" value="1"><label for="pr1">高精度変換</label>
        <input type="radio" name="proc" id="pr2" value="2"><label for="pr2">色ずらし</label>
        <input type="radio" name="proc" id="pr3" value="3"><label for="pr3">ハイライト</label>
      </div>
      <p id="modeDesc"></p>
      <div class="toggles">
        <label class="sw"><input type="checkbox" id="simChk"><span>その人の見え方で確認</span></label>
        <label class="sw"><input type="checkbox" id="cmpChk"><span>左右比較（元／変換後）</span></label>
      </div></div>
    <div class="sect"><h3>調整</h3>
      <div class="sliders">
        <div><label for="sev"><span>色覚の程度</span><b id="sevV">100%</b></label><input type="range" id="sev" min="0" max="100" value="100"></div>
        <div class="ctx" data-m="1"><label for="beta"><span>変換の強さ</span><b id="betaV">100%</b></label><input type="range" id="beta" min="0" max="150" value="100"></div>
        <div class="ctx" data-m="2" style="display:none"><label for="ang"><span>色をずらす角度</span><b id="angV">0°</b></label><input type="range" id="ang" min="0" max="360" value="0"></div>
        <div class="ctx" data-m="3" style="display:none"><label for="hr"><span>色の範囲</span><b id="hrV">ΔE20</b></label><input type="range" id="hr" min="5" max="60" value="20"></div>
      </div></div>
    <div class="acts">
      <button id="freeze"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg><span id="freezeL">一時停止</span></button>
      <button id="flip"><svg viewBox="0 0 24 24"><path d="M4 8h12l-3-3M20 16H8l3 3"/></svg><span>カメラ切替</span></button>
      <button id="chart"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M5 18l5-5 3 3 3-3 3 3"/></svg><span>テスト画像</span></button>
      <button id="testBtn" class="hl"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 10.5a3 3 0 015.5 1.2c0 1.8-2.5 2-2.5 3.3M12 17.5v.2"/></svg><span>色覚テスト</span></button>
    </div>
  </div>

  <div id="test">
    <div id="tQ">
      <p id="tTitle">円の中の数字を入力してください。見えなければ「見えない」。</p>
      <p id="tHint">画面の明るさを上げて、ナイトモードや色味の調整はオフにしてください。</p>
      <canvas id="plate" width="480" height="480"></canvas>
      <div id="tAns">—</div>
      <div id="pad"></div>
      <button id="tNone">見えない</button>
      <div class="tfoot"><span id="tProg"></span><button id="tCancel">やめる</button></div>
    </div>
    <div id="tRes">
      <div id="tResTxt"></div>
      <div class="btns2"><button class="primary" id="tApply">この設定を使う</button><button id="tTune">調整テスト（おすすめ）</button><button id="tAlt">もう一方で使う</button><button id="tMore">詳しく調べる</button><button id="tAgain">もう一度</button><button id="tClose">閉じる</button></div>
    </div>
  </div>

</div>

<script>
/* ===== 純粋な計算部分（DOMなし）。単体テスト可能 ===== */
const MATS={ // Machado et al. 2009, severity 1.0, 線形RGBに適用
  p:[[0.152286,1.052583,-0.204868],[0.114503,0.786281,0.099216],[-0.003882,-0.048116,1.051998]],
  d:[[0.367322,0.860646,-0.227968],[0.280085,0.672501,0.047413],[-0.011820,0.042940,0.968881]],
  t:[[1.255528,-0.076749,-0.178779],[-0.078411,0.930809,0.147602],[0.004733,0.691367,0.303900]],
  a:[[0.2126,0.7152,0.0722],[0.2126,0.7152,0.0722],[0.2126,0.7152,0.0722]]};
const GRAY=[1,1,1].map(x=>x/Math.sqrt(3));
const toLinJ=v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)};
const toSrgb8=v=>{v=Math.min(1,Math.max(0,v));return Math.round(255*(v<=.0031308?v*12.92:1.055*Math.pow(v,1/2.4)-.055))};
const mv=(m,v)=>[0,1,2].map(r=>m[r][0]*v[0]+m[r][1]*v[1]+m[r][2]*v[2]);
const clamp01=v=>v.map(x=>Math.min(1,Math.max(0,x)));
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function cvdM(type,sev){return MATS[type].map((row,r)=>row.map((x,c)=>{const id=r===c?1:0;return id+sev*(x-id)}))}
function rotM(deg){const t=deg*Math.PI/180,c=Math.cos(t),s=Math.sin(t),k=(1-c)/3,u=s/Math.sqrt(3);
  return [[c+k,k-u,k+u],[k+u,c+k,k-u],[k-u,k+u,c+k]];}
function lab(v){const [r,g,b]=v;
  const X=.4124564*r+.3575761*g+.1804375*b,Y=.2126729*r+.7151522*g+.0721750*b,Z=.0193339*r+.1191920*g+.9503041*b;
  const f=t=>t>216/24389?Math.cbrt(t):(24389/27*t+16)/116,fx=f(X/.95047),fy=f(Y),fz=f(Z/1.08883);
  return [116*fy-16,500*(fx-fy),200*(fy-fz)];}
const dE=(a,b)=>{const p=lab(a),q=lab(b);return Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2])};

/* 混同線の方向（変換行列の零空間）。全色盲は色度方向 */
function nullDir(type){
  const F=MATS[type];
  if(type==='a'){const w=F[0],n=[w[1]-w[2],w[2]-w[0],w[0]-w[1]],m=Math.hypot(...n);return n.map(x=>x/m)}
  let best=null,bm=0;
  [[0,1],[0,2],[1,2]].forEach(([i,j])=>{const a=F[i],b=F[j];
    const n=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],m=Math.hypot(...n);
    if(m>bm){bm=m;best=n.map(x=>x/m)}});
  return best;
}
function gap(a,n){let tp=Infinity,tm=Infinity;
  for(let k=0;k<3;k++){
    if(n[k]>1e-6){tp=Math.min(tp,(1-a[k])/n[k]);tm=Math.min(tm,a[k]/n[k]);}
    else if(n[k]<-1e-6){tp=Math.min(tp,a[k]/-n[k]);tm=Math.min(tm,(1-a[k])/-n[k]);}}
  return {tp,tm};}
function partner(a,type){const n=nullDir(type),{tp,tm}=gap(a,n),t=tp>=tm?tp:-tm;return a.map((x,k)=>x+.95*t*n[k]);}
function pairAt(a,n,alpha){const {tp,tm}=gap(a,n);
  return [a.map((x,k)=>x-alpha*.95*tm*n[k]),a.map((x,k)=>x+alpha*.95*tp*n[k])];}

/* 赤緑→青黄 投影：混同線方向の成分(c)を、見える方向(青黄)の移動量に写す。グレーは不変 */
function projParams(type){
  if(type==='a') return {nt:[0,0,0],u:[0,0,0]};
  const n=nullDir(type),k=dot(n,GRAY),nt=n.map((x,i)=>x-k*GRAY[i]),m=Math.hypot(...nt);
  return {nt:nt.map(x=>x/m),u:type==='t'?[1,-1,0].map(x=>x/Math.SQRT2):[1,1,-2].map(x=>x/Math.sqrt(6))};}
function projApply(type,beta,a){const {nt,u}=projParams(type),c=dot(nt,a);return clamp01(a.map((x,i)=>x+beta*c*u[i]));}

/* 自動調整用：混同ペアのサンプル（固定乱数）。3JND≒ΔE6.9（Zhu 2024） */
const _sp={};
function samplePairs(type){
  if(_sp[type]) return _sp[type];
  let s=7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647},n=nullDir(type),out=[];
  for(let i=0;i<500;i++){const a=[r(),r(),r()],[lo,hi]=pairAt(a,n,.3);if(dE(lo,hi)>=20)out.push([lo,hi]);}
  return _sp[type]=out;}
const p10=arr=>{arr.sort((x,y)=>x-y);return arr[Math.floor(arr.length*.1)]};
function autoBeta(type,sev){
  if(type==='a') return 0;
  const M=cvdM(type,sev),P=samplePairs(type);
  for(let b=0;b<=3.001;b+=.1) if(p10(P.map(([x,y])=>dE(mv(M,projApply(type,b,x)),mv(M,projApply(type,b,y)))))>=6.9) return +b.toFixed(1);
  return 3;}
function autoAngle(type,sev){
  const M=cvdM(type,sev),P=samplePairs(type);let bestA=0,bestV=-1;
  for(let g=0;g<360;g+=5){const R=rotM(g),v=p10(P.map(([x,y])=>dE(mv(M,clamp01(mv(R,x))),mv(M,clamp01(mv(R,y))))));if(v>bestV){bestV=v;bestA=g}}
  return bestA;}

/* ===== 数字テスト（実在の検査表の構成に準拠） =====
 構成：デモ板→空白板→スクリーニング(P/D/T各2枚)→[通過なら終了]→分類板(Ishihara 22-25型の2桁)→程度判定(階段法)
 板の難しさ：シンボルと背景の色差ΔE*ab。目安は 弱15–22／中30–40／強50–60（Birch 1993、Jurasevska 2014）
 板の色：混同線上の色（灰色と区別がつかない色）＋明るさのノイズ（KAMS/HRRと同じ考え方） */
const BASES=[[184,74,74],[100,204,102],[136,136,136],[86,95,214],[230,160,180],[120,80,50]];
const BASES_L=BASES.map(c=>c.map(toLinJ));
const LADDER=[7,10,15,20,25,30,40,50,60]; // 階段法で使う色差ΔE
const DE_REF=9;                           // 普通の目が読める下限ΔE（KAMSの最小板が9）
const SCREEN_DE=18;                       // スクリーニング板の色差（弱い色覚異常の帯 15–22）
const CLASS_DE=40;                        // 分類板の色差（中等度の帯）
const YL=[.22,.34];                       // 灰色の明るさ（線形）。KAMSと同じ『明るい・暗い』の2段階だけにして、明るさのノイズを抑える
const _tc={};
function solveT(a,n,sign,tmax,T){
  const col=t=>a.map((x,i)=>x+sign*t*n[i]);let hi=tmax*.98;
  if(dE(a,col(hi))<=T) return hi;
  let lo=0;for(let i=0;i<30;i++){const m=(lo+hi)/2;if(dE(a,col(m))<T)lo=m;else hi=m;}
  return (lo+hi)/2;}
function tTable(axis,T){ // 灰色から混同線上へ、色差がTになる移動量
  const k=axis+'|'+T;if(_tc[k])return _tc[k];
  const n=nullDir(axis);
  const rows=YL.map(Y=>{const a=[Y,Y,Y],g=gap(a,n);return {Y,a,tp:solveT(a,n,1,g.tp,T),tm:solveT(a,n,-1,g.tm,T)};});
  return _tc[k]={n,rows};}
function symColor(axis,T,idx,sign){const {n,rows}=tTable(axis,T),r=rows[idx],t=sign>0?r.tp:r.tm;
  return r.a.map((x,i)=>x+sign*t*n[i]);}
function plateAtten(obs,s,axis){ // 観測者(obs,重さs)に、axis方向の色差がどれだけ残って見えるか（0〜1）
  const M=cvdM(obs,s),{rows}=tTable(axis,30);let num=0,den=0;
  rows.forEach(r=>[1,-1].forEach(sg=>{const c=symColor(axis,30,rows.indexOf(r),sg);
    num+=dE(mv(M,r.a),mv(M,c));den+=dE(r.a,c);}));
  return num/den;}
function estSev(type,Tthr){ // 読めた最小色差Tthr → モデル上の重さ(0〜1)
  if(Tthr>=65) return 1;
  const f=DE_REF/Tthr;if(f>=1) return 0;

    s+=`${'①②③④⑤⑥'[i]} 普通${n.toFixed(0)}｜そのまま${s0.toFixed(1)}｜高精度${sp.toFixed(1)}${sp>=6.9?'✓':''}｜回転${sr.toFixed(1)}${sr>=6.9?'✓':''}\n`;});
  return s;
}

/* ---------- 色名（実際の色。※名前のルールは簡易版） ---------- */
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;}
  return [h,s,l];}
function nameOf(r,g,b){
  const [h,s,l]=rgb2hsl(r,g,b);
  if(l<.1) return '黒';
  if(l>.93&&s<.5) return '白';
  if(s<.1) return l<.3?'濃い灰色':l>.72?'明るい灰色':'灰色';
  let n;
  if(h<15||h>=345) n='赤';
  else if(h<45) n=l<.42?'茶色':'オレンジ';
  else if(h<65) n=l<.35?'茶色':'黄色';
  else if(h<95) n='黄緑';
  else if(h<165) n='緑';
  else if(h<195) n='青緑';
  else if(h<220) n='水色';
  else if(h<255) n='青';
  else if(h<290) n='紫';
  else n=l>.7?'ピンク':'赤紫';
  if(n==='赤'&&l>.72) n='ピンク';
  if(n==='茶色') return s<.3?'くすんだ茶色':n;
  let p='';if(l<.28)p='暗い';else if(l>.78)p='明るい';else if(s<.3)p='くすんだ';
  return p+n;}
function sample(){
  if(!st.ready) return;
  const src=st.frozen?frozenCv:video,w=cv.width,h=cv.height;
  const R=Math.max(4,Math.round(w/120)),sx=Math.min(w-2*R,Math.max(0,Math.round(st.pt.x*w-R))),sy=Math.min(h-2*R,Math.max(0,Math.round(st.pt.y*h-R)));
  try{sctx.drawImage(src,sx,sy,2*R,2*R,0,0,1,1);}catch(e){return}
  const [r,g,b]=sctx.getImageData(0,0,1,1).data;
  st.lastRGB=[r,g,b];
  $('sw').style.background=`rgb(${r},${g},${b})`;
  $('cname').textContent=nameOf(r,g,b);
  $('chex').textContent='実際の色  RGB('+r+', '+g+', '+b+')';
  $('readout').style.display='flex';
}

/* ---------- 数字テスト（実在の検査表の構成：デモ→空白→スクリーニング→分類→程度判定→調整） ---------- */
const T={ax:null,cur:null,queue:[],phase:'',log:null,res:null,ans:'',more:false,tErr:0,last:null,tune:null};
const NAME={p:'P型（1型・赤が弱い）',d:'D型（2型・緑が弱い）',t:'T型（3型・青が弱い）'};
const GR={mild:'弱い',medium:'中程度',strong:'強い',none:'ほぼ普通'};
const POOL=['2','3','5','6','8','9'];                 // 読み間違えにくい、丸みのある数字（KAMSも丸い数字を使用）
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function randNum(nd){let s='';for(let i=0;i<nd;i++){let d;do{d=POOL[rnd(POOL.length)]}while(s.includes(d));s+=d;}return s;}
const makeScreening=()=>shuffle(['p','p','d','d','t','t']).map(a=>({kind:'vanish',axis:a,T:SCREEN_DE,text:randNum(Math.random()<.35?1:2)}));
const makeClass=()=>[0,1,2].map(()=>{const L=randNum(1);let R;do{R=randNum(1)}while(R===L);return {kind:'class',T:CLASS_DE,left:L,right:R,text:L+R};});

function drawPlate(spec){
  /* 板の作り：小さなドット（3種類の大きさ）を密に敷き詰める／明るさは『明るい・暗い』の2段階だけ／
     シンボルのドットは、混同線上の色（灰色と区別がつかない色）。赤っぽい・緑っぽいの両方を使う（KAMS, Birch 1993） */
  const c=$('plate'),x=c.getContext('2d'),S=c.width,R=S/2-4,bg=toSrgb8(.28);
  x.fillStyle=`rgb(${bg},${bg},${bg})`;x.fillRect(0,0,S,S);
  const maskOf=(txt,cx,size)=>{const m=document.createElement('canvas');m.width=m.height=S;const g=m.getContext('2d');
    g.fillStyle=g.strokeStyle='#000';g.lineWidth=S*(txt.length>1?.008:.018);g.lineJoin='round'; // 輪郭を少しだけ太らせる（数字の穴をつぶさない）
    g.font=`bold ${Math.round(size)}px Arial,"Helvetica Neue",Helvetica,sans-serif`;g.textAlign='center';g.textBaseline='middle';
    g.strokeText(txt,cx,S/2+S*.03);g.fillText(txt,cx,S/2+S*.03);return g.getImageData(0,0,S,S).data;};
  let masks=[];
  if(spec.kind==='class') masks=[maskOf(spec.left,S*.31,S*.56),maskOf(spec.right,S*.69,S*.56)];
  else if(spec.text) masks=[maskOf(spec.text,S/2,spec.text.length>1?S*.56:S*.78)];
  const inM=(i,px,py)=>masks[i]&&masks[i][(Math.round(py)*S+Math.round(px))*4+3]>128;
  const rs=[.0065,.0095,.013].map(v=>v*S),cell=S*.03,Gd={},dots=[];
  for(let t=0;t<40000&&dots.length<4500;t++){
    const r=rs[rnd(3)],px=Math.random()*S,py=Math.random()*S;
    if(Math.hypot(px-S/2,py-S/2)>R-r) continue;
    const gx=Math.floor(px/cell),gy=Math.floor(py/cell);let ok=true;
    for(let ix=gx-1;ix<=gx+1&&ok;ix++)for(let iy=gy-1;iy<=gy+1&&ok;iy++){const L=Gd[ix+','+iy];if(L)for(const q of L){if(Math.hypot(px-q[0],py-q[1])<r+q[2]+.8){ok=false;break}}}
    if(ok){dots.push([px,py,r]);(Gd[gx+','+gy]||(Gd[gx+','+gy]=[])).push([px,py,r]);}}
  const conv=spec.conv,memo={};
  const cvt=col=>{if(!conv) return col;const b=daltonize(conv.type,col);return clamp01(col.map((z,j)=>z+conv.k*(b[j]-z)));};
  for(const [px,py,r] of dots){
    const m0=inM(0,px,py),m1=inM(1,px,py),inside=m0||m1;
    const idx=inside?(Math.random()<.57?1:0):rnd(YL.length),sign=Math.random()<.5?1:-1;   // シンボルは明るいドットが57%
    let col=[YL[idx],YL[idx],YL[idx]];
    if(spec.kind==='demo'){const g=m0?[.42,.52,.62][rnd(3)]:[.10,.14,.18][rnd(3)];col=[g,g,g];}  // デモ板：明るさの差（誰でも読める）
    else if(spec.kind==='class'){if(m0)col=symColor('p',spec.T,idx,sign);else if(m1)col=symColor('d',spec.T,idx,sign);}
    else if(m0) col=symColor(spec.axis,spec.T,idx,sign);
    if(conv&&inside){const key=idx+'|'+sign;col=memo[key]||(memo[key]=cvt(col));}               // 調整板：変換をかけた色で描く
    x.fillStyle=`rgb(${col.map(toSrgb8).join(',')})`;
    x.beginPath();x.arc(px,py,r,0,7);x.fill();}
}
function showAns(){$('tAns').textContent=T.ans||'—';}
function progText(c){
  const L=T.log;
  if(c.kind==='demo') return 'デモ板（採点なし）';
  if(c.kind==='blank') return '板 2';
  if(c.kind==='vanish') return `スクリーニング ${L.screen.length+1}/6`;
  if(c.kind==='class') return `分類 ${L.cls.length+1}/3`;
  if(c.kind==='tune') return `調整テスト ${T.tune.n+1}枚目（最大${T.tune.max}枚）`;
  return `程度の判定 ${Object.values(T.ax).reduce((s,a)=>s+a.n,0)+1}問目`;}
function initStair(){
  T.ax={p:newAxis(10),d:newAxis(10),t:newAxis(6)};
  if(!T.tErr){T.ax.t.done=true;T.ax.t.floor=true;} // T軸は、スクリーニングで間違えた人だけ調べる
  T.last=null;}
function nextStair(){
  const open=['p','d','t'].filter(k=>!T.ax[k].done);if(!open.length) return null;
  let cand=open.filter(k=>k!==T.last);if(!cand.length)cand=open;
  const pool=[];cand.forEach(k=>{for(let i=0;i<(k==='t'?1:2);i++)pool.push(k)});
  const axis=pool[rnd(pool.length)];T.last=axis;
  return {kind:'stair',axis,T:axT(T.ax[axis]),text:randNum(1)};}
function nextPlate(){
  $('tTitle').textContent='円の中の数字を入力してください。見えなければ「見えない」。';
  if(T.phase==='tune'){
    if(T.tune.done) return tuneFinish();
    T.cur={kind:'tune',axis:T.tune.type,T:T.tune.T,text:randNum(1),conv:{type:T.tune.type,k:KL[T.tune.i]}};
    $('tTitle').textContent='この板には、変換がかかっています。数字を入力してください。';
    drawPlate(T.cur);T.ans='';showAns();$('tProg').textContent=progText(T.cur);return;}
  if(!T.queue.length){
    if(T.phase==='screen') return afterScreening();
    if(T.phase==='class'){T.phase='stair';initStair();}
  }
  if(T.queue.length) T.cur=T.queue.shift();
  else{const sp=nextStair();if(!sp) return testFinish();T.cur=sp;}
  drawPlate(T.cur);T.ans='';showAns();$('tProg').textContent=progText(T.cur);}
function afterScreening(){
  const sc=T.log.screen,errs=sc.filter(x=>!x.ok).length;
  T.tErr=sc.filter(x=>x.axis==='t'&&!x.ok).length;
  if(errs<=1&&!T.more){T.phase='done';return testFinish();} // HRRと同じ：スクリーニングを通れば終了
  T.phase='class';T.queue=makeClass();nextPlate();}
function submit(){
  const c=T.cur;if(!c) return;const a=T.ans,L=T.log;
  if(c.kind==='demo') L.demo=(a===c.text);
  else if(c.kind==='blank') L.blank=(a==='');
  else if(c.kind==='vanish') L.screen.push({axis:c.axis,ok:a===c.text});
  else if(c.kind==='class'){ // 右の数字だけ＝P型の手がかり／左だけ＝D型の手がかり（Ishihara分類板と同じ考え方）
    L.cls.push(a===c.text?'both':a===c.right?'p':a===c.left?'d':a===''?'none':'other');}
  else if(c.kind==='tune') tuneUpdate(T.tune,a===c.text);
  else stairUpdate(T.ax[c.axis],a===c.text);
  nextPlate();}
function press(d){
  if(!T.cur) return;
  if(T.ans.length>=2) return;
  T.ans+=d;showAns();
  if(T.ans.length===T.cur.text.length&&T.cur.kind!=='blank') submit();}
function testOpen(more){
  hideUI();T.more=!!more;
  $('test').style.display='flex';$('tRes').style.display='none';$('tQ').style.display='flex';
  T.log={demo:null,blank:null,screen:[],cls:[]};T.res=null;T.tune=null;
  T.phase='screen';T.queue=[{kind:'demo',text:'12'},{kind:'blank',text:''},...makeScreening()];nextPlate();}
function testClose(){$('test').style.display='none';T.cur=null;}
function testFinish(){
  const L=T.log,errs=L.screen.filter(x=>!x.ok).length,lines=[];
  lines.push(`デモ板：${L.demo===null?'―':L.demo?'読めた':'読めなかった（画面や視力を確認してください）'}`);
  lines.push(`スクリーニング：${6-errs}/6 正解 → ${errs<=1?'通過':'要詳細'}（誤答1枚以内で通過）`);
  if(L.blank===false) lines.push('※何もない板に数字を答えました（当てずっぽうの可能性）');
  if(T.phase==='done'){T.res={passed:true,lines};}
  else{
    const cnt={p:0,d:0,both:0,none:0,other:0};L.cls.forEach(h=>cnt[h]++);
    const thr={p:thrOf(T.ax.p),d:thrOf(T.ax.d),t:thrOf(T.ax.t)},r=classify(thr,{p:cnt.p,d:cnt.d}),fmt=v=>v>=65?'読めず':'ΔE'+v;
    lines.push(`分類板：P型の手がかり ${cnt.p}枚／D型の手がかり ${cnt.d}枚／両方読めた ${cnt.both}枚／読めず ${cnt.none+cnt.other}枚`);
    lines.push(`程度判定（読めた最小の色差。小さいほど細かい差が読めた）：P軸 ${fmt(thr.p)}／D軸 ${fmt(thr.d)}${T.tErr?'／T軸 '+fmt(thr.t):''}`);
    T.res={passed:false,thr,r,lines,k:null,tuned:false};}
  renderResult();}
function renderResult(){
  const R=T.res;let t=R.lines.join('\n');
  ['tApply','tAlt','tMore','tTune'].forEach(i=>$(i).style.display='none');
  if(R.passed){
    t+='\n\nスクリーニングを通過しました。この検査で見つかる範囲では、色覚はほぼ普通です。\nただし、弱い色覚異常は通ってしまうことがあります（実際のスクリーニング検査も同じです）。';
    $('tMore').style.display='';
  }else{
    const r=R.r;
    if(r.type==='none') t+='\n\n偏りははっきりしませんでした。画面や部屋の明るさで結果が変わります。場所を変えて、もう一度試すこともできます。';
    else{
      const k=R.k!=null?R.k:(autoStrength(r.type,r.sev)||.5),pl=planSettings(r.type,r.sev,R.thr[r.type],k);
      t+=`\n\n${NAME[r.type]}の傾向 ／ 程度：${GR[r.grade]}（目安 ${Math.round(r.sev*100)}%）\n目安の帯：弱 ΔE15–22／中 30–40／強 50–60（Birch 1993）`;
      if(r.ambiguous&&(r.type==='p'||r.type==='d')){
        const o=r.type==='p'?'d':'p';t+=`\nP型とD型の区別があいまいです。下のボタンで、${NAME[o].slice(0,2)}でも使えます。`;
        $('tAlt').textContent=NAME[o].slice(0,2)+'で使う';$('tAlt').style.display='';$('tAlt').dataset.type=o;}
      t+=`\n\n【自動設定】\n・タイプ ${NAME[pl.type].slice(0,2)}／程度 ${Math.round(pl.sev*100)}%\n・表示 高精度変換 強さ ${Math.round(pl.beta*100)}%${R.tuned?'（調整テストで確認済み）':'（モデルからの推定）'}\n・色ずらしの角度 ${pl.ang}°\n・ハイライトの色の範囲 ΔE${pl.hr}`;
      $('tApply').style.display='';
      if((r.type==='p'||r.type==='d')&&!R.tuned&&!R.tuneFail) $('tTune').style.display='';
    }
  }
  t+='\n\n※医療の診断ではありません。画面の明るさ・色設定・部屋の明るさで結果が変わります。気になる場合は眼科で検査を受けてください。';
  $('tResTxt').textContent=t;$('tQ').style.display='none';$('tRes').style.display='flex';}
function startTune(){ // 変換をかけた板を読んでもらい、その人に必要な強さを決める
  const R=T.res,r=R.r;if(!r||(r.type!=='p'&&r.type!=='d')) return;
  T.phase='tune';T.queue=[];T.tune=newTune(autoStrength(r.type,r.sev)||.5,r.type,tuneLevel(R.thr[r.type]));
  $('tRes').style.display='none';$('tQ').style.display='flex';nextPlate();}
function tuneFinish(){
  const u=T.tune,R=T.res;T.phase='done';
  R.k=u.fail?1.5:KL[u.i];R.tuned=!u.fail;R.tuneFail=u.fail;
  R.lines.push(u.fail?'調整テスト：強さ150%でも読めませんでした。ハイライトや色名表示の併用をおすすめします。':`調整テスト：変換をかけた板が、強さ${Math.round(KL[u.i]*100)}%で読めました。`);
  renderResult();}
function applyPlan(type){
  const R=T.res,r=R.r,sev=r.all[type],k=(type===r.type&&R.k!=null)?R.k:(autoStrength(type,sev)||.5),p=planSettings(type,sev,R.thr[type],k);
  Object.assign(st,{type:p.type,sev:p.sev,proc:1,beta:p.beta,ang:p.ang,hr:p.hr,cmp:false,sim:false});
  testClose();syncUI();updateUniforms();save();showUI();}
for(const d of ['1','2','3','4','5','6','7','8','9']){const b=document.createElement('button');b.textContent=d;b.onclick=()=>press(d);$('pad').appendChild(b);}
{const b=document.createElement('button');b.textContent='消す';b.style.fontSize='14px';b.onclick=()=>{T.ans=T.ans.slice(0,-1);showAns();};$('pad').appendChild(b);}
{const b=document.createElement('button');b.textContent='0';b.onclick=()=>press('0');$('pad').appendChild(b);}
{const b=document.createElement('button');b.textContent='決定';b.style.fontSize='14px';b.onclick=submit;$('pad').appendChild(b);}
$('tNone').onclick=()=>{T.ans='';showAns();submit();};
$('tCancel').onclick=testClose;$('tClose').onclick=testClose;$('tAgain').onclick=()=>testOpen(false);
$('tMore').onclick=()=>{T.more=true;$('tRes').style.display='none';$('tQ').style.display='flex';T.phase='class';T.queue=makeClass();T.log.cls=[];nextPlate();};
$('tTune').onclick=startTune;
$('tApply').onclick=()=>{if(T.res&&T.res.r)applyPlan(T.res.r.type);};
$('tAlt').onclick=()=>{if(T.res&&T.res.r)applyPlan($('tAlt').dataset.type);};

/* ---------- 操作 ---------- */
$('startBtn').onclick=startCam;
$('chartBtn0').onclick=showChart;
$('testBtn0').onclick=()=>testOpen(false);$('testBtn').onclick=()=>testOpen(false);
$('chart').onclick=()=>{if(st.chart)startCam();else showChart();};
$('flip').onclick=()=>{st.facing=st.facing==='environment'?'user':'environment';startCam();};
$('freeze').onclick=()=>{
  if(!st.ready||st.chart) return;
  st.frozen=!st.frozen;
  if(st.frozen) fctx.drawImage(video,0,0,frozenCv.width,frozenCv.height);
  $('freezeL').textContent=st.frozen?'再開':'一時停止';};
document.querySelectorAll('input[name=type]').forEach(i=>i.onchange=()=>{st.type=i.value;refresh();save();});
document.querySelectorAll('input[name=proc]').forEach(i=>i.onchange=()=>{
  st.proc=+i.value;
  if(st.proc===3&&!st.target&&st.lastRGB) setTarget(st.lastRGB);
  syncUI();updateUniforms();save();});
$('simChk').onchange=e=>{st.sim=e.target.checked;syncUI();updateUniforms();save();};
$('cmpChk').onchange=e=>{st.cmp=e.target.checked;st.split=.5;syncUI();updateUniforms();};
$('sev').oninput=e=>{st.sev=e.target.value/100;syncUI();refresh();save();};
$('beta').oninput=e=>{st.beta=e.target.value/100;syncUI();refresh();save();};
$('ang').oninput=e=>{setAng(+e.target.value);save();};
$('hr').oninput=e=>{st.hr=+e.target.value;syncUI();updateUniforms();save();};
if(!gl){$('start').querySelector('p').textContent='このブラウザはWebGLに対応していません。';$('startBtn').style.display='none';}
load();syncUI();updateUniforms();frame();

</script>
